<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="980" viewBox="0 0 1180 980" role="img" aria-labelledby="title desc">
  <title id="title">PhysioNet EEGMMIDB 64 到 32 导联建议</title>
  <desc id="desc">头顶俯视图。绿色为建议保留的三十二个导联，红色虚线为建议掩盖的三十二个导联；该布局完整包含二十三导联核心方案。</desc>
  <defs>
    <style>
      .title { font: 700 27px sans-serif; fill: #172033; }
      .subtitle { font: 15px sans-serif; fill: #4b5563; }
      .head { fill: #fbfcfe; stroke: #60708a; stroke-width: 4; }
      .feature { fill: none; stroke: #60708a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .kept { fill: #d9f7e8; stroke: #16855b; stroke-width: 2.6; }
      .masked { fill: #ffe4e1; stroke: #c54840; stroke-width: 2.2; stroke-dasharray: 4 3; }
      .label { font: 700 10.5px sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .panel-title { font: 700 18px sans-serif; fill: #172033; }
      .panel-text { font: 14px sans-serif; fill: #334155; }
      .panel-small { font: 12.5px sans-serif; fill: #475569; }
      .axis { font: 13px sans-serif; fill: #667085; }
      .row { font: 12px monospace; fill: #334155; }
      .added { font: 700 12.5px sans-serif; fill: #0f766e; }
    </style>
  </defs>

  <rect width="1180" height="980" fill="#ffffff"/>
  <text x="590" y="38" class="title" text-anchor="middle">PhysioNet EEGMMIDB：64 → 32 导联建议</text>
  <text x="590" y="65" class="subtitle" text-anchor="middle">23 导联核心 + 9 个外围导联；上方为鼻子，图左为左半球</text>

  <!-- Head, nose, and ears -->
  <ellipse cx="400" cy="505" rx="330" ry="395" class="head"/>
  <path d="M365 116 L400 78 L435 116" class="feature"/>
  <path d="M72 410 C30 420 30 565 74 575" class="feature"/>
  <path d="M728 410 C770 420 770 565 726 575" class="feature"/>
  <text x="76" y="930" class="axis">左半球</text>
  <text x="672" y="930" class="axis">右半球</text>

  <!-- FP -->
  <g><circle cx="330" cy="155" r="18" class="masked"/><text x="330" y="155" class="label">FP1</text></g>
  <g><circle cx="400" cy="145" r="18" class="masked"/><text x="400" y="145" class="label">FPZ</text></g>
  <g><circle cx="470" cy="155" r="18" class="masked"/><text x="470" y="155" class="label">FP2</text></g>

  <!-- AF -->
  <g><circle cx="205" cy="215" r="18" class="masked"/><text x="205" y="215" class="label">AF7</text></g>
  <g><circle cx="300" cy="205" r="18" class="masked"/><text x="300" y="205" class="label">AF3</text></g>
  <g><circle cx="400" cy="200" r="18" class="masked"/><text x="400" y="200" class="label">AFZ</text></g>
  <g><circle cx="500" cy="205" r="18" class="masked"/><text x="500" y="205" class="label">AF4</text></g>
  <g><circle cx="595" cy="215" r="18" class="masked"/><text x="595" y="215" class="label">AF8</text></g>

  <!-- F -->
  <g><circle cx="125" cy="290" r="18" class="masked"/><text x="125" y="290" class="label">F7</text></g>
  <g><circle cx="195" cy="275" r="18" class="kept"/><text x="195" y="275" class="label">F5</text></g>
  <g><circle cx="265" cy="265" r="18" class="kept"/><text x="265" y="265" class="label">F3</text></g>
  <g><circle cx="330" cy="258" r="18" class="masked"/><text x="330" y="258" class="label">F1</text></g>
  <g><circle cx="400" cy="255" r="18" class="masked"/><text x="400" y="255" class="label">FZ</text></g>
