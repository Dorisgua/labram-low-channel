  <g><circle cx="535" cy="265" r="18" class="kept"/><text x="535" y="265" class="label">F4</text></g>
  <g><circle cx="605" cy="275" r="18" class="kept"/><text x="605" y="275" class="label">F6</text></g>
  <g><circle cx="675" cy="290" r="18" class="masked"/><text x="675" y="290" class="label">F8</text></g>

  <!-- FT / FC -->
  <g><circle cx="110" cy="370" r="18" class="kept"/><text x="110" y="370" class="label">FT7</text></g>
  <g><circle cx="180" cy="355" r="18" class="kept"/><text x="180" y="355" class="label">FC5</text></g>
  <g><circle cx="250" cy="345" r="18" class="kept"/><text x="250" y="345" class="label">FC3</text></g>
  <g><circle cx="325" cy="340" r="18" class="kept"/><text x="325" y="340" class="label">FC1</text></g>
  <g><circle cx="400" cy="337" r="18" class="kept"/><text x="400" y="337" class="label">FCZ</text></g>
  <g><circle cx="475" cy="340" r="18" class="kept"/><text x="475" y="340" class="label">FC2</text></g>
  <g><circle cx="550" cy="345" r="18" class="kept"/><text x="550" y="345" class="label">FC4</text></g>
  <g><circle cx="620" cy="355" r="18" class="kept"/><text x="620" y="355" class="label">FC6</text></g>
  <g><circle cx="690" cy="370" r="18" class="kept"/><text x="690" y="370" class="label">FT8</text></g>

  <!-- T / C -->
  <g><circle cx="70" cy="465" r="18" class="masked"/><text x="70" y="465" class="label">T9</text></g>
  <g><circle cx="120" cy="465" r="18" class="kept"/><text x="120" y="465" class="label">T7</text></g>
  <g><circle cx="180" cy="465" r="18" class="kept"/><text x="180" y="465" class="label">C5</text></g>
  <g><circle cx="245" cy="465" r="18" class="kept"/><text x="245" y="465" class="label">C3</text></g>
  <g><circle cx="325" cy="465" r="18" class="kept"/><text x="325" y="465" class="label">C1</text></g>
  <g><circle cx="400" cy="465" r="18" class="kept"/><text x="400" y="465" class="label">CZ</text></g>
  <g><circle cx="475" cy="465" r="18" class="kept"/><text x="475" y="465" class="label">C2</text></g>
  <g><circle cx="555" cy="465" r="18" class="kept"/><text x="555" y="465" class="label">C4</text></g>
  <g><circle cx="620" cy="465" r="18" class="kept"/><text x="620" y="465" class="label">C6</text></g>
  <g><circle cx="680" cy="465" r="18" class="kept"/><text x="680" y="465" class="label">T8</text></g>
  <g><circle cx="730" cy="465" r="18" class="masked"/><text x="730" y="465" class="label">T10</text></g>

  <!-- TP / CP -->
  <g><circle cx="110" cy="560" r="18" class="masked"/><text x="110" y="560" class="label">TP7</text></g>
  <g><circle cx="180" cy="575" r="18" class="kept"/><text x="180" y="575" class="label">CP5</text></g>
  <g><circle cx="250" cy="585" r="18" class="kept"/><text x="250" y="585" class="label">CP3</text></g>
  <g><circle cx="325" cy="590" r="18" class="kept"/><text x="325" y="590" class="label">CP1</text></g>
  <g><circle cx="400" cy="593" r="18" class="kept"/><text x="400" y="593" class="label">CPZ</text></g>
  <g><circle cx="475" cy="590" r="18" class="kept"/><text x="475" y="590" class="label">CP2</text></g>
  <g><circle cx="550" cy="585" r="18" class="kept"/><text x="550" y="585" class="label">CP4</text></g>
  <g><circle cx="620" cy="575" r="18" class="kept"/><text x="620" y="575" class="label">CP6</text></g>
  <g><circle cx="690" cy="560" r="18" class="masked"/><text x="690" y="560" class="label">TP8</text></g>

  <!-- P -->
  <g><circle cx="125" cy="650" r="18" class="masked"/><text x="125" y="650" class="label">P7</text></g>
  <g><circle cx="195" cy="665" r="18" class="masked"/><text x="195" y="665" class="label">P5</text></g>
  <g><circle cx="265" cy="675" r="18" class="kept"/><text x="265" y="675" class="label">P3</text></g>
  <g><circle cx="330" cy="682" r="18" class="masked"/><text x="330" y="682" class="label">P1</text></g>
  <g><circle cx="400" cy="685" r="18" class="kept"/><text x="400" y="685" class="label">PZ</text></g>
  <g><circle cx="470" cy="682" r="18" class="masked"/><text x="470" y="682" class="label">P2</text></g>
  <g><circle cx="535" cy="675" r="18" class="kept"/><text x="535" y="675" class="label">P4</text></g>
  <g><circle cx="605" cy="665" r="18" class="masked"/><text x="605" y="665" class="label">P6</text></g>
  <g><circle cx="675" cy="650" r="18" class="masked"/><text x="675" y="650" class="label">P8</text></g>

  <!-- PO -->
  <g><circle cx="205" cy="740" r="18" class="masked"/><text x="205" y="740" class="label">PO7</text></g>
  <g><circle cx="300" cy="750" r="18" class="masked"/><text x="300" y="750" class="label">PO3</text></g>
  <g><circle cx="400" cy="755" r="18" class="masked"/><text x="400" y="755" class="label">POZ</text></g>
  <g><circle cx="500" cy="750" r="18" class="masked"/><text x="500" y="750" class="label">PO4</text></g>
  <g><circle cx="595" cy="740" r="18" class="masked"/><text x="595" y="740" class="label">PO8</text></g>

  <!-- O / IZ -->
  <g><circle cx="330" cy="815" r="18" class="masked"/><text x="330" y="815" class="label">O1</text></g>
  <g><circle cx="400" cy="820" r="18" class="masked"/><text x="400" y="820" class="label">OZ</text></g>
  <g><circle cx="470" cy="815" r="18" class="masked"/><text x="470" y="815" class="label">O2</text></g>
  <g><circle cx="400" cy="875" r="18" class="masked"/><text x="400" y="875" class="label">IZ</text></g>

  <!-- Recommendation panel -->
  <rect x="775" y="105" width="370" height="795" rx="18" class="panel"/>
  <text x="805" y="145" class="panel-title">保留 32（绿色）</text>
  <text x="805" y="175" class="row">F5 F3 F4 F6</text>
  <text x="805" y="199" class="row">FT7 FC5 FC3 FC1 FCZ</text>
  <text x="805" y="223" class="row">FC2 FC4 FC6 FT8</text>
  <text x="805" y="247" class="row">T7 C5 C3 C1 CZ</text>
  <text x="805" y="271" class="row">C2 C4 C6 T8</text>
  <text x="805" y="295" class="row">CP5 CP3 CP1 CPZ</text>
  <text x="805" y="319" class="row">CP2 CP4 CP6</text>
  <text x="805" y="343" class="row">P3 PZ P4</text>

  <text x="805" y="385" class="added">相对 23 导联新增：</text>
  <text x="805" y="409" class="row">F5 F6 FT7 FT8 T7 T8 P3 PZ P4</text>

  <text x="805" y="455" class="panel-title">掩盖 32（红色虚线）</text>
  <text x="805" y="485" class="row">FP1 FPZ FP2</text>
  <text x="805" y="509" class="row">AF7 AF3 AFZ AF4 AF8</text>
  <text x="805" y="533" class="row">F7 F1 FZ F2 F8</text>
  <text x="805" y="557" class="row">T9 T10 TP7 TP8</text>
  <text x="805" y="581" class="row">P7 P5 P1 P2 P6 P8</text>
  <text x="805" y="605" class="row">PO7 PO3 POZ PO4 PO8</text>
  <text x="805" y="629" class="row">O1 OZ O2 IZ</text>

  <circle cx="820" cy="678" r="16" class="kept"/>
  <text x="850" y="683" class="panel-text">真实输入导联</text>
  <circle cx="820" cy="720" r="16" class="masked"/>
  <text x="850" y="725" class="panel-text">从输入中删除/掩盖</text>

  <text x="805" y="775" class="panel-title">设计原则</text>
  <text x="805" y="805" class="panel-small">• 完整包含 23 导联感觉运动核心</text>
  <text x="805" y="830" class="panel-small">• 新增导联全部保持左右对称</text>
  <text x="805" y="855" class="panel-small">• 增加额颞、中央外侧和顶区覆盖</text>
  <text x="805" y="880" class="panel-small">• 便于做 23 → 32 → 64 嵌套消融</text>

  <text x="590" y="958" class="subtitle" text-anchor="middle">相对位置示意图；建议按通道名选择数据，不要直接复用 EEG-FM-Bench 的整数 chs 索引</text>
</svg>
